# Install as /etc/codex/config.toml. This is a low-priority system default;
# users can override it from ~/.codex/config.toml, a profile, or -c flags.
# The CraneSched Skill is auto-discovered from /etc/codex/skills for every user.
# Codex reports this system location with admin scope; users may disable
# individual names with [[skills.config]].
model = "gpt-5.6-sol"
model_provider = "cluster_shared"
model_reasoning_effort = "xhigh"

[model_providers.cluster_shared]
name = "CraneSched-Codex Proxy"
base_url = "http://127.0.0.1:617/v1"
wire_api = "responses"
requires_openai_auth = false
