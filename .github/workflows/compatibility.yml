name: Compatibility

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Run x86_64 EL9 compatibility and RPM checks
        run: |
          docker run --privileged --rm \
            -e DNF_TRANSACTION_TEST=1 \
            -e SYSTEM_CONFIG_RUNTIME_TEST=1 \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            rockylinux:9 \
            bash .github/scripts/run-el9-ci.sh
