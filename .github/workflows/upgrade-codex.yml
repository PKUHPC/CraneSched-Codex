name: Upgrade Codex

on:
  workflow_dispatch:
    inputs:
      codex_version:
        description: Stable Codex version, without the rust-v prefix
        required: true
        type: string
      rpm_release:
        description: Positive RPM release number
        required: true
        default: "1"
        type: string
permissions:
  contents: read

concurrency:
  group: codex-upgrade
  cancel-in-progress: false

jobs:
  prepare-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Create upgrade GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CRANESCHED_CODEX_APP_ID }}
          private-key: ${{ secrets.CRANESCHED_CODEX_APP_PRIVATE_KEY }}

      - name: Check out main and submodules
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}

      - name: Update Codex Source Lock and submodule
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CODEX_VERSION: ${{ inputs.codex_version }}
          RPM_RELEASE: ${{ inputs.rpm_release }}
        run: |
          packaging/update-codex-lock.sh "${CODEX_VERSION}" "${RPM_RELEASE}"

      - name: Run x86_64 EL9 preflight
        run: |
          docker run --privileged --rm \
            -e DNF_TRANSACTION_TEST=1 \
            -e SYSTEM_CONFIG_RUNTIME_TEST=1 \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            rockylinux:9 \
            bash .github/scripts/run-el9-ci.sh

      - name: Create upgrade PR and enable auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CODEX_VERSION: ${{ inputs.codex_version }}
          RPM_RELEASE: ${{ inputs.rpm_release }}
        run: |
          branch="automation/codex-${CODEX_VERSION}-${RPM_RELEASE}-${GITHUB_RUN_ID}"
          git config user.name "cranesched-codex-upgrader[bot]"
          git config user.email "cranesched-codex-upgrader[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git add packaging/codex.lock.json ref/codex
          git diff --cached --quiet && {
            printf 'The requested version and RPM release produce no repository change.\n' >&2
            exit 1
          }
          git commit -m "chore: upgrade Codex to ${CODEX_VERSION}-${RPM_RELEASE}"
          git push --set-upstream origin "${branch}"
          pr_url="$(gh pr create \
            --base main \
            --head "${branch}" \
            --label codex-upgrade \
            --title "Upgrade Codex to ${CODEX_VERSION}-${RPM_RELEASE}" \
            --body "Automated Codex Source Lock and submodule update. Compatibility and RPM checks must pass before merge.")"
          gh pr merge "${pr_url}" --auto --squash --delete-branch
