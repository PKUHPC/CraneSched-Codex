name: Upgrade Codex
run-name: Upgrade Codex to ${{ inputs.codex_version }}-${{ inputs.rpm_release }}

on:
  workflow_dispatch:
    inputs:
      codex_version:
        description: Stable Codex version, without the rust-v prefix
        required: true
        type: string
      rpm_release:
        description: Positive RPM release number
        required: true
        default: "1"
        type: string
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: codex-upgrade
  cancel-in-progress: false

jobs:
  prepare-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out main and submodules
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive
          token: ${{ github.token }}
          persist-credentials: false

      - name: Update Codex Source Lock and submodule
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_VERSION: ${{ inputs.codex_version }}
          RPM_RELEASE: ${{ inputs.rpm_release }}
        run: |
          packaging/update-codex-lock.sh "${CODEX_VERSION}" "${RPM_RELEASE}"

      - name: Restore verified Codex artifact cache
        uses: actions/cache@v4
        with:
          path: dist/cache
          key: codex-source-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/codex.lock.json') }}

      - name: Verify Source Lock, submodule, and official artifact
        run: packaging/verify-codex-source.sh

      - name: Create draft upgrade PR
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_VERSION: ${{ inputs.codex_version }}
          RPM_RELEASE: ${{ inputs.rpm_release }}
        run: |
          branch="automation/codex-${CODEX_VERSION}-${RPM_RELEASE}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git add packaging/codex.lock.json submodules/codex
          git diff --cached --quiet && {
            printf 'The requested version and RPM release produce no repository change.\n' >&2
            exit 1
          }
          git commit -m "chore(upgrade): upgrade Codex to ${CODEX_VERSION}-${RPM_RELEASE}"
          git \
            -c credential.helper= \
            -c credential.helper='!gh auth git-credential' \
            push --set-upstream origin "${branch}"
          pr_url="$(gh pr create \
            --base main \
            --head "${branch}" \
            --draft \
            --label codex-upgrade \
            --title "chore(upgrade): upgrade Codex to ${CODEX_VERSION}-${RPM_RELEASE}" \
            --body "Automated Codex Source Lock and submodule update. Review this Draft PR, then mark it ready to start Compatibility CI. Approve and squash-merge only after the required check passes.")"
          printf 'Created Draft PR for administrator review: %s\n' "${pr_url}"
