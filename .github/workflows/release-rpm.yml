name: Release RPM

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write

concurrency:
  group: rpm-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'automation/codex-') &&
      contains(github.event.pull_request.labels.*.name, 'codex-upgrade')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Verify squash-only repository policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          policy_ok="$(gh api "repos/${GITHUB_REPOSITORY}" \
            --jq '.allow_squash_merge and (.allow_merge_commit | not) and (.allow_rebase_merge | not)')"
          if [[ "${policy_ok}" != "true" ]]; then
            printf 'Release requires squash-only repository merge settings.\n' >&2
            exit 1
          fi

      - name: Check out the merged commit and submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Restore verified Codex artifact cache
        uses: actions/cache@v4
        with:
          path: dist/cache
          key: codex-source-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/codex.lock.json') }}

      - name: Rebuild and validate release artifact from merged state
        run: |
          docker run --privileged --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            rockylinux:9 \
            bash .github/scripts/run-el9-ci.sh release

      - name: Publish RPM
        env:
          GH_TOKEN: ${{ github.token }}
          MERGED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          version="$(jq -r .version packaging/codex.lock.json)"
          rpm_release="$(jq -r .rpm_release packaging/codex.lock.json)"
          tag="v${version}-${rpm_release}"
          rpm_path="$(find dist -maxdepth 1 -type f \
            -name "cranesched-codex-${version}-${rpm_release}.el9.x86_64.rpm" \
            -print -quit)"
          [[ -n "${rpm_path}" ]]
          if gh release view "${tag}" >/dev/null 2>&1; then
            printf 'Release %s already exists.\n' "${tag}" >&2
            exit 1
          fi
          release_args=(
            "${tag}"
            "${rpm_path}"
            --target "${MERGED_SHA}"
            --title "CraneSched-Codex ${version}-${rpm_release}"
            --generate-notes
          )
          gh release create "${release_args[@]}"
